    PainelDoca.renderTable = function (items) {
      PainelDoca.configureDetailsTable();
      const body = document.getElementById('tableBody');
      const search = PainelDoca.norm(document.getElementById('searchInput').value);
      let rows = [...items];
      if (search) {
        rows = rows.filter(item => {
          const bs = PainelDoca.bluesoftForItem(item) || {};
          return PainelDoca.norm([
            item.id, item.usuario, item.responsavelInfraDesk, item.lojaTexto, item.fornecedorNome,
            item.subcategoria, item.statusNome, item.chaveAcesso, item.cnpjEmitente, item.nfNumero,
            bs.numeroCarga, bs.cargaCriadaPor, bs.statusCarga, bs.statusRecebimento
          ].join(' ')).includes(search);
        });
      }
      document.getElementById('detailsHint').textContent = `${rows.length} chamado(s).`;
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="${PainelDoca.state.reportMode === 'recebimentos' ? 11 : 9}" class="empty">Nenhum registro para mostrar.</td></tr>`;
        return;
      }
      const frag = document.createDocumentFragment();
      for (const item of rows) frag.appendChild(PainelDoca.state.reportMode === 'recebimentos' ? PainelDoca.buildReceiptTableRow(item) : PainelDoca.buildDocaTableRow(item));
      body.innerHTML = '';
      body.appendChild(frag);
    };

    PainelDoca.renderChips = function (boxId, values, selectedSet, touchedName, colorByUser) {
      const box = document.getElementById(boxId);
      const meta = document.getElementById(boxId === 'usersBox' ? 'usersMeta' : 'storesMeta');
      const singular = boxId === 'usersBox' ? (PainelDoca.state.reportMode === 'recebimentos' ? 'responsável' : 'usuário') : 'loja';
      const plural = boxId === 'usersBox' ? (PainelDoca.state.reportMode === 'recebimentos' ? 'responsáveis' : 'usuários') : 'lojas';
      if (!PainelDoca.state[touchedName]) {
        selectedSet.clear();
        values.forEach(v => selectedSet.add(v));
      }
      for (const value of [...selectedSet]) if (!values.includes(value)) selectedSet.delete(value);
      const count = PainelDoca.state[touchedName] ? values.filter(v => selectedSet.has(v)).length : values.length;
      meta.textContent = !values.length ? `Sem ${plural}` : count === values.length ? `Todos (${values.length})` : count === 0 ? `Nenhum ${singular}` : `${count} de ${values.length}`;
      box.innerHTML = '';
      if (!values.length) {
        box.innerHTML = `<span class="hint">Sem ${plural} ainda</span>`;
        return;
      }
      for (const value of values) {
        const checked = selectedSet.has(value);
        const label = document.createElement('label');
        label.className = 'chip' + (checked ? ' active' : '');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = checked;
        input.addEventListener('change', function () {
          PainelDoca.state[touchedName] = true;
          if (input.checked) selectedSet.add(value);
          else selectedSet.delete(value);
          PainelDoca.scheduleRender();
        });
        const dot = document.createElement('span');
        dot.className = 'colorDot';
        dot.style.background = colorByUser ? PainelDoca.colorFor(value) : '#1a82cd';
        const text = document.createElement('span');
        text.textContent = colorByUser ? PainelDoca.shortUserName(value) : value;
        text.title = value;
        label.appendChild(input);
        label.appendChild(dot);
        label.appendChild(text);
        box.appendChild(label);
      }
    };

    PainelDoca.renderFilterOptions = function () {
      document.getElementById('usersTitle').textContent = PainelDoca.state.reportMode === 'recebimentos' ? 'Responsáveis' : 'Usuários';
      document.getElementById('receiveStatusField').classList.toggle('hidden', PainelDoca.state.reportMode !== 'recebimentos');
      document.getElementById('printBtn').classList.toggle('hidden', PainelDoca.state.reportMode !== 'recebimentos');
      document.getElementById('categoryFilterLabel').textContent = 'Subcategoria';

      PainelDoca.renderChips('usersBox', PainelDoca.getAllUsers(), PainelDoca.state.selectedUsers, 'touchedUsers', true);
      PainelDoca.renderChips('storesBox', PainelDoca.getAllStores(), PainelDoca.state.selectedStores, 'touchedStores', false);

      const select = document.getElementById('filterSubcategoria');
      const current = select.value;
      const values = PainelDoca.getAllSubcategories();
      select.innerHTML = '<option value="">Todas</option>';
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
      if (values.includes(current)) select.value = current;

      const group = document.getElementById('groupBy');
      const wanted = PainelDoca.state.reportMode === 'recebimentos'
        ? [
            ['responsavelInfraDesk','Responsável'], ['lojaTexto','Loja'], ['situacaoRecebimento','Situação'],
            ['statusBluesoft','Status Bluesoft'], ['fornecedorNome','Fornecedor']
          ]
        : [
            ['usuario','Usuário'], ['lojaTexto','Loja'], ['subcategoria','Subcategoria'], ['statusNome','Status'], ['fornecedorNome','Fornecedor']
          ];
      const oldGroup = group.value;
      group.innerHTML = wanted.map(([v,t]) => `<option value="${v}">${t}</option>`).join('');
      if (wanted.some(([v]) => v === oldGroup)) group.value = oldGroup;
      else group.value = PainelDoca.state.reportMode === 'recebimentos' ? 'responsavelInfraDesk' : 'usuario';
    };

    PainelDoca.render = function () {
      PainelDoca.renderFilterOptions();
      PainelDoca.renderHeader();
      const items = PainelDoca.getVisibleItems();
      PainelDoca.renderChart(items);
      PainelDoca.renderRanking(items);
      if (PainelDoca.state.detailsVisible) PainelDoca.renderTable(items);
      if (PainelDoca.state.reportMode === 'recebimentos') {
        clearTimeout(PainelDoca.state.bluesoftSyncTimer);
        PainelDoca.state.bluesoftSyncTimer = setTimeout(() => PainelDoca.syncBluesoft().catch(err => console.warn(err)), 250);
      }
    };

    PainelDoca.scheduleRender = function () {
      if (PainelDoca.state.renderFrame) cancelAnimationFrame(PainelDoca.state.renderFrame);
      PainelDoca.state.renderFrame = requestAnimationFrame(function () {
        PainelDoca.state.renderFrame = null;
        PainelDoca.render();
      });
    };

    PainelDoca.setStatus = function (ok, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      dot.className = 'dot ' + (ok ? 'ok' : 'err');
      statusText.textContent = text;
    };

    PainelDoca.fetchJson = async function (url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data || {};
    };

    PainelDoca.fetchReceiptsSnapshot = async function () {
      const base = PainelDoca.FIREBASE_DB_URL.replace(/\/+$/, '');
      const [captures, history] = await Promise.all([
        PainelDoca.fetchJson(base + PainelDoca.PATH).catch(() => ({})),
        PainelDoca.fetchJson(base + PainelDoca.HISTORY_PATH).catch(() => ({}))
      ]);
      const merged = { ...(captures || {}) };
      for (const [id, item] of Object.entries(history || {})) {
        merged[id] = { ...(merged[id] || {}), ...(item || {}) };
      }
      return merged;
    };

    PainelDoca.fetchSnapshot = async function (useServerDateFilter) {
      const res = await fetch(PainelDoca.firebaseUrl(useServerDateFilter), { cache: 'no-store' });
      let data = null;
      try { data = await res.json(); }
      catch (_) { throw new Error(`Resposta inválida do Firebase. HTTP ${res.status}`); }
      if (!res.ok || (data && data.error)) {
        const message = (data && data.error) || `HTTP ${res.status}`;
        const error = new Error(message);
        error.status = res.status;
        error.firebasePayload = data;
        throw error;
      }
      return data || {};
    };

    PainelDoca.showLoadError = function (error) {
      document.getElementById('chart').innerHTML = `<div class="empty">Não consegui carregar o Firebase.<br><span class="muted">${PainelDoca.escapeHTML(error && error.message ? error.message : 'Erro desconhecido')}</span></div>`;
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" class="empty">Erro ao carregar dados.</td></tr>';
    };

    PainelDoca.loadInitial = async function () {
      if (PainelDoca.state.eventSource) {
        PainelDoca.state.eventSource.close();
        PainelDoca.state.eventSource = null;
      }
      PainelDoca.state.hasInitialLoad = false;
      try {
        if (PainelDoca.state.reportMode === 'recebimentos') {
          PainelDoca.cancelBluesoftListeners();
          PainelDoca.setStatus(false, 'Carregando histórico InfraDesk...');
          const data = await PainelDoca.fetchReceiptsSnapshot();
          PainelDoca.state.queryMode = 'historico';
          PainelDoca.state.byId = PainelDoca.normalizeSnapshot(data || {});
          PainelDoca.state.hasInitialLoad = true;
          PainelDoca.setStatus(true, `${Object.keys(PainelDoca.state.byId).length} chamado(s) InfraDesk`);
          PainelDoca.state.lastTotalCount = 0;
          PainelDoca.state.lastTotals = new Map();
          PainelDoca.scheduleRender();
          return;
        }

        PainelDoca.setStatus(false, 'Carregando turbo...');
        const data = await PainelDoca.fetchSnapshot(true);
        PainelDoca.state.queryMode = 'turbo';
        PainelDoca.state.byId = PainelDoca.normalizeSnapshot(data || {});
        PainelDoca.state.hasInitialLoad = true;
        PainelDoca.setStatus(true, 'Online turbo');
        PainelDoca.state.lastTotalCount = 0;
        PainelDoca.state.lastTotals = new Map();
        PainelDoca.scheduleRender();
        PainelDoca.connectRealtime(true);
      } catch (turboError) {
        console.warn('Modo turbo do Firebase falhou. Tentando modo seguro sem filtro por índice:', turboError);
        try {
          PainelDoca.setStatus(false, 'Modo seguro...');
          const data = await PainelDoca.fetchSnapshot(false);
          PainelDoca.state.queryMode = 'seguro';
          PainelDoca.state.byId = PainelDoca.normalizeSnapshot(data || {});
          PainelDoca.state.hasInitialLoad = true;
          PainelDoca.setStatus(true, 'Online seguro');
          PainelDoca.toast('Modo seguro: confira .indexOn capturadoEm');
          PainelDoca.state.lastTotalCount = 0;
          PainelDoca.state.lastTotals = new Map();
          PainelDoca.scheduleRender();
          PainelDoca.connectRealtime(false);
        } catch (safeError) {
          console.error('Erro ao carregar Firebase:', safeError);
          PainelDoca.state.byId = {};
          PainelDoca.setStatus(false, 'Erro');
          PainelDoca.showLoadError(safeError);
        }
      }
    };

    PainelDoca.applyRemoteItem = function (id, item) {
      const normalized = PainelDoca.normalizeItem(id, item);
      if (!normalized) delete PainelDoca.state.byId[id];
      else PainelDoca.state.byId[normalized.id] = normalized;
    };

    PainelDoca.handleFirebaseEvent = function (raw, eventType) {
      let payload;
      try { payload = JSON.parse(raw || '{}'); }
      catch (_) { return; }
      const path = String(payload.path || '/');
      const data = payload.data;
      const parts = path.replace(/^\/+/, '').split('/').filter(Boolean);
      if ((path === '/' || path === '') && eventType === 'put') {
        if (!PainelDoca.state.hasInitialLoad) {
          PainelDoca.state.byId = PainelDoca.normalizeSnapshot(data || {});
          PainelDoca.state.hasInitialLoad = true;
          PainelDoca.setStatus(true, 'Online');
          PainelDoca.scheduleRender();
        }
        return;
      }
      if ((path === '/' || path === '') && eventType === 'patch') {
        for (const [childId, childData] of Object.entries(data || {})) {
          if (childData === null) delete PainelDoca.state.byId[childId];
          else PainelDoca.applyRemoteItem(childId, childData);
        }
        PainelDoca.setStatus(true, 'Online');
        PainelDoca.scheduleRender();
        return;
      }
      const id = PainelDoca.clean(parts[0]);
      if (!id) return;
      if (data === null) delete PainelDoca.state.byId[id];
      else if (parts.length === 1) PainelDoca.applyRemoteItem(id, data);
      else {
        const current = Object.assign({}, PainelDoca.state.byId[id] || { chamadoId: id });
        current[parts[1]] = data;
        PainelDoca.applyRemoteItem(id, current);
      }
      PainelDoca.setStatus(true, 'Online');
      PainelDoca.scheduleRender();
    };

    PainelDoca.connectRealtime = function (useServerDateFilter) {
      if (PainelDoca.state.eventSource) PainelDoca.state.eventSource.close();
      try {
        const es = new EventSource(PainelDoca.firebaseUrl(useServerDateFilter !== false));
        es.addEventListener('put', function (event) { PainelDoca.handleFirebaseEvent(event.data, 'put'); });
        es.addEventListener('patch', function (event) { PainelDoca.handleFirebaseEvent(event.data, 'patch'); });
        es.onerror = function () { PainelDoca.setStatus(false, 'Reconectando...'); };
        PainelDoca.state.eventSource = es;
      } catch (error) {
        console.error('Erro no realtime:', error);
        PainelDoca.setStatus(false, 'Erro');
      }
    };

    PainelDoca.reloadForRange = function () {
      clearTimeout(PainelDoca.state.reloadTimer);
      PainelDoca.state.reloadTimer = setTimeout(PainelDoca.loadInitial, 220);
      PainelDoca.scheduleRender();
    };

    PainelDoca.setReportMode = function (mode) {
      if (!['doca','recebimentos'].includes(mode) || mode === PainelDoca.state.reportMode) return;
      PainelDoca.state.reportMode = mode;
      PainelDoca.state.touchedUsers = false;
      PainelDoca.state.touchedStores = false;
      PainelDoca.state.selectedUsers.clear();
      PainelDoca.state.selectedStores.clear();
      document.getElementById('filterReceiveStatus').value = 'todos';
      PainelDoca.state.lastTotalCount = 0;
      PainelDoca.state.lastTotals = new Map();
      if (mode === 'doca') PainelDoca.cancelBluesoftListeners();
      PainelDoca.loadInitial();
      PainelDoca.scheduleRender();
    };

    PainelDoca.setMode = function (mode) {
      PainelDoca.state.mode = mode;
      PainelDoca.state.lastTotalCount = 0;
      PainelDoca.state.lastTotals = new Map();
      PainelDoca.loadInitial();
      PainelDoca.scheduleRender();
    };

    PainelDoca.prevPeriod = function () {
      if (PainelDoca.state.mode === 'week') PainelDoca.state.weekStart = PainelDoca.addDays(PainelDoca.state.weekStart, -7);
      if (PainelDoca.state.mode === 'month') PainelDoca.state.monthStart = PainelDoca.addMonths(PainelDoca.state.monthStart, -1);
      PainelDoca.state.lastTotalCount = 0;
      PainelDoca.state.lastTotals = new Map();
      PainelDoca.loadInitial();
      PainelDoca.scheduleRender();
    };

    PainelDoca.nextPeriod = function () {
      if (PainelDoca.state.mode === 'week') {
        const currentWeek = PainelDoca.startOfWeek(new Date());
        const next = PainelDoca.addDays(PainelDoca.state.weekStart, 7);
        if (PainelDoca.toDateInput(next) <= PainelDoca.toDateInput(currentWeek)) PainelDoca.state.weekStart = next;
      }
      if (PainelDoca.state.mode === 'month') {
        const currentMonth = PainelDoca.startOfMonth(new Date());
        const next = PainelDoca.addMonths(PainelDoca.state.monthStart, 1);
        if (PainelDoca.toDateInput(next) <= PainelDoca.toDateInput(currentMonth)) PainelDoca.state.monthStart = next;
      }
      PainelDoca.state.lastTotalCount = 0;
      PainelDoca.state.lastTotals = new Map();
      PainelDoca.loadInitial();
      PainelDoca.scheduleRender();
    };

    PainelDoca.toggleDetails = function () {
      PainelDoca.state.detailsVisible = !PainelDoca.state.detailsVisible;
      document.getElementById('detailsPanel').classList.toggle('hidden', !PainelDoca.state.detailsVisible);
      document.getElementById('toggleDetailsBtn').textContent = PainelDoca.state.detailsVisible ? 'Ocultar detalhes' : 'Ver detalhes';
      if (PainelDoca.state.detailsVisible) PainelDoca.renderTable(PainelDoca.getVisibleItems());
    };

    PainelDoca.toggleSummary = function () {
      PainelDoca.state.summaryVisible = !PainelDoca.state.summaryVisible;
      document.getElementById('summaryPanel').classList.toggle('hidden', !PainelDoca.state.summaryVisible);
      document.getElementById('mainGrid').classList.toggle('noSummary', !PainelDoca.state.summaryVisible);
      document.getElementById('summaryToggleBtn').textContent = PainelDoca.state.summaryVisible ? 'Ocultar resumo' : 'Mostrar resumo';
      PainelDoca.scheduleRender();
    };

    PainelDoca.clearFilters = function () {
      document.getElementById('searchGeneral').value = '';
      document.getElementById('searchChamado').value = '';
      document.getElementById('searchNf').value = '';
      document.getElementById('searchCnpj').value = '';
      document.getElementById('filterSubcategoria').value = '';
      document.getElementById('filterReceiveStatus').value = 'todos';
      document.getElementById('searchInput').value = '';
      PainelDoca.state.touchedUsers = false;
      PainelDoca.state.touchedStores = false;
      PainelDoca.state.selectedUsers.clear();
      PainelDoca.state.selectedStores.clear();
      PainelDoca.state.lastTotalCount = 0;
      PainelDoca.state.lastTotals = new Map();
      PainelDoca.scheduleRender();
    };

    PainelDoca.copyText = async function (text) {
      text = PainelDoca.clean(text);
      if (!text) return;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const input = document.createElement('textarea');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }
      PainelDoca.toast('Chave copiada');
    };

    PainelDoca.toast = function (message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(PainelDoca.toastTimer);
      PainelDoca.toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1500);
    };

    PainelDoca.exportCsv = function () {
      const rows = PainelDoca.getVisibleItems();
      let header;
      let valuesFor;
      let filename;
      if (PainelDoca.state.reportMode === 'recebimentos') {
        header = ['chamadoId','aberturaInfraDesk','liberadoInfraDesk','responsavel','loja','fornecedor','chaveAcesso','cnpj','nf','situacao','statusBluesoft','numeroCarga','statusCarga','statusRomaneio','cargaCriadaEm','cargaCriadaPor','conferidoPor','dataFechamentoCarga'];
        valuesFor = item => {
          const bs = PainelDoca.bluesoftForItem(item) || {};
          return [item.id,item.aberturaTexto,item.liberadoTexto,item.responsavelInfraDesk,item.lojaTexto,item.fornecedorNome,item.chaveAcesso,item.cnpjEmitente,item.nfNumeroLimpo || item.nfNumero,PainelDoca.receiveStateInfo(item).label,bs.statusRecebimento,bs.numeroCarga,bs.statusCarga,bs.statusRomaneio,bs.cargaCriadaEm,bs.cargaCriadaPor || bs.geradoPorTela,bs.conferidoPor,bs.dataFechamentoCarga];
        };
        filename = 'infradesk-recebimentos-bluesoft.csv';
      } else {
        header = ['chamadoId','reservadoEm','aberturaTexto','lojaTexto','fornecedorNome','subcategoria','statusNome','chaveAcesso','cnpjEmitente','nfNumero','usuario'];
        valuesFor = item => [item.id,item.reservaDataTexto,item.aberturaTexto,item.lojaTexto,item.fornecedorNome,item.subcategoria,item.statusNome,item.chaveAcesso,item.cnpjEmitente,item.nfNumero,item.usuario];
        filename = 'infra-doca-capturas-graficos.csv';
      }
      const lines = [header.join(';')];
      for (const item of rows) {
        const values = valuesFor(item).map(value => '"' + PainelDoca.clean(value).replace(/"/g, '""') + '"');
        lines.push(values.join(';'));
      }
      const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    PainelDoca.printReceiptReport = function () {
      const rows = PainelDoca.getVisibleItems();
      const range = PainelDoca.currentRange();
      const counts = { finalizada:0, com_carga:0, sem_carga:0, nao_sincronizada:0, outro:0 };
      rows.forEach(item => { const k = PainelDoca.receiveStateInfo(item).key; counts[k] = (counts[k] || 0) + 1; });
      const win = window.open('about:blank', '_blank');
      if (!win) { PainelDoca.toast('O navegador bloqueou a janela do relatório.'); return; }
      const period = PainelDoca.state.mode === 'all' ? 'Todos os registros' : `${PainelDoca.fullDateLabel(range.startKey || '')} a ${PainelDoca.fullDateLabel(range.endKey || '')}`;
      const bodyRows = rows.map((item, i) => {
        const bs = PainelDoca.bluesoftForItem(item) || {};
        const state = PainelDoca.receiveStateInfo(item);
        const visual = PainelDoca.visualStatusBluesoft(bs.statusRecebimento || 'Não sincronizada');
        return `<tr><td>${i+1}</td><td>${PainelDoca.escapeHTML(item.lojaTexto || '—')}</td><td>${PainelDoca.escapeHTML(item.nfNumeroLimpo || item.nfNumero || '—')}</td><td>${PainelDoca.escapeHTML(item.fornecedorNome || '—')}</td><td>${PainelDoca.escapeHTML(item.responsavelInfraDesk || '—')}</td><td>${PainelDoca.escapeHTML(item.aberturaTexto || '—')}</td><td>${PainelDoca.escapeHTML(item.liberadoTexto || '—')}</td><td>${PainelDoca.escapeHTML(bs.numeroCarga || '—')}</td><td>${PainelDoca.escapeHTML(bs.cargaCriadaEm || '—')}</td><td>${PainelDoca.escapeHTML(bs.cargaCriadaPor || bs.geradoPorTela || '—')}</td><td><img src="${visual.icon}" title="${PainelDoca.escapeHTML(visual.label)}"><small>${PainelDoca.escapeHTML(state.label)}</small></td></tr>`;
      }).join('');
      win.document.open();
      win.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de Recebimentos</title><style>@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;color:#222;margin:0}h1{font-size:22px;margin:0 0 8px}.meta{font-size:10px;border-bottom:3px solid #333;padding-bottom:8px;margin-bottom:10px}.summary{border:1px solid #bbb;padding:8px;margin-bottom:10px;font-size:10px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #aaa;padding:4px 5px;font-size:8.5px;vertical-align:top;overflow:hidden;text-overflow:ellipsis}th{background:#f3f4f6;font-weight:800}td img{width:14px;height:14px;vertical-align:middle}td small{display:block;margin-top:2px;font-size:7.5px;color:#555}</style></head><body><h1>Relatório de Recebimentos • InfraDesk × Bluesoft</h1><div class="meta"><strong>Gerado em:</strong> ${new Date().toLocaleString('pt-BR')} &nbsp; <strong>Período de abertura:</strong> ${period}</div><div class="summary"><strong>${rows.length}</strong> registro(s) • <strong>${counts.finalizada}</strong> finalizada(s) • <strong>${counts.com_carga}</strong> com carga pendente • <strong>${counts.sem_carga}</strong> sem carga • <strong>${counts.nao_sincronizada}</strong> não sincronizada(s)</div><table><thead><tr><th>#</th><th>Loja</th><th>NF</th><th>Fornecedor</th><th>Responsável</th><th>Criado InfraDesk</th><th>Liberado</th><th>Carga</th><th>Criação carga</th><th>Criada por</th><th>Bluesoft</th></tr></thead><tbody>${bodyRows}</tbody></table></body></html>`);
      win.document.close();
      setTimeout(() => { try { win.focus(); win.print(); } catch (_) {} }, 450);
    };

    PainelDoca.bind = function () {
      document.getElementById('reportRecebimentos').addEventListener('click', () => PainelDoca.setReportMode('recebimentos'));
      document.getElementById('reportDoca').addEventListener('click', () => PainelDoca.setReportMode('doca'));
      document.getElementById('modeWeek').addEventListener('click', () => PainelDoca.setMode('week'));
      document.getElementById('modeMonth').addEventListener('click', () => PainelDoca.setMode('month'));
      document.getElementById('modeCustom').addEventListener('click', () => PainelDoca.setMode('custom'));
      document.getElementById('modeAll').addEventListener('click', () => PainelDoca.setMode('all'));
      document.getElementById('prevPeriodBtn').addEventListener('click', PainelDoca.prevPeriod);
      document.getElementById('nextPeriodBtn').addEventListener('click', PainelDoca.nextPeriod);
      document.getElementById('dateFrom').addEventListener('change', PainelDoca.reloadForRange);
      document.getElementById('dateTo').addEventListener('change', PainelDoca.reloadForRange);
      ['searchGeneral', 'searchChamado', 'searchNf', 'searchCnpj', 'filterSubcategoria', 'filterReceiveStatus', 'groupBy', 'chartMode'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', function () {
          PainelDoca.state.lastTotalCount = 0;
          PainelDoca.state.lastTotals = new Map();
          PainelDoca.scheduleRender();
        });
        el.addEventListener('change', function () {
          PainelDoca.state.lastTotalCount = 0;
          PainelDoca.state.lastTotals = new Map();
          PainelDoca.scheduleRender();
        });
      });
      document.getElementById('searchInput').addEventListener('input', function () {
        PainelDoca.renderTable(PainelDoca.getVisibleItems());
      });
      document.getElementById('clearBtn').addEventListener('click', PainelDoca.clearFilters);
      document.getElementById('reloadBtn').addEventListener('click', PainelDoca.loadInitial);
      document.getElementById('toggleDetailsBtn').addEventListener('click', PainelDoca.toggleDetails);
      document.getElementById('summaryToggleBtn').addEventListener('click', PainelDoca.toggleSummary);
      document.getElementById('exportBtn').addEventListener('click', PainelDoca.exportCsv);
      document.getElementById('printBtn').addEventListener('click', PainelDoca.printReceiptReport);
      document.addEventListener('click', function (event) {
        const stat = event.target.closest('[data-receive-filter]');
        if (stat) {
          document.getElementById('filterReceiveStatus').value = stat.getAttribute('data-receive-filter') || 'todos';
          PainelDoca.scheduleRender();
          return;
        }
        const btn = event.target.closest('[data-copy]');
        if (btn) PainelDoca.copyText(btn.getAttribute('data-copy') || '');
      });
      window.addEventListener('resize', PainelDoca.scheduleRender);
      window.addEventListener('beforeunload', function () {
        if (PainelDoca.state.eventSource) PainelDoca.state.eventSource.close();
        if (PainelDoca.state.historyEventSource) PainelDoca.state.historyEventSource.close();
        PainelDoca.cancelBluesoftListeners();
      });
    };

    PainelDoca.start = function () {
      const now = new Date();
      PainelDoca.state.weekStart = PainelDoca.startOfWeek(now);
      PainelDoca.state.monthStart = PainelDoca.startOfMonth(now);
      const range = PainelDoca.currentRange();
      document.getElementById('dateFrom').value = range.startKey;
      document.getElementById('dateTo').value = range.endKey;
      PainelDoca.state.detailsVisible = true;
      document.getElementById('detailsPanel').classList.remove('hidden');
      document.getElementById('toggleDetailsBtn').textContent = 'Ocultar detalhes';
      PainelDoca.bind();
      PainelDoca.render();
      PainelDoca.loadInitial();
    };

    PainelDoca.start();
  </script>
</body>
</html>
